name: Desplegar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Compilar y desplegar
    runs-on: ubuntu-latest

    env:
      REMOTE_PATH: domains/etnicos365.com/public_html

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, bcmath, curl, dom, fileinfo, filter, hash, json, openssl, pcre, pdo, pdo_mysql, session, tokenizer, zip, gd
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias PHP (produccion)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar assets (Vite + Tailwind)
        run: |
          npm ci
          npm run build

      - name: Subir archivos al servidor (rsync sobre SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          sshpass -p "$SSH_PASSWORD" rsync -az --delete \
            --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $SSH_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='/.htaccess' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='*.zip' \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Migraciones y cache de produccion
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd $REMOTE_PATH && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"
